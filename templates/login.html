{% extends "base.html" %}
{% block title %}Login | Smart Shop AI{% endblock %}
{% block content %}<section class="auth-section"><div class="auth-visual"><img src="{{ url_for('static', filename='images/hero.jpg') }}" alt="Fashion"></div><div class="auth-card"><span class="kicker">WELCOME BACK</span><h1>Sign in to Smart Shop AI</h1><p>Access your dashboard and continue your shopping experience.</p><form method="POST"><label><span>Username</span><input name="username" required placeholder="Your username"></label><label><span>Password</span><input type="password" name="password" required minlength="6" placeholder="Your password"></label><button class="btn btn-primary btn-wide" type="submit">Sign in</button></form><p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}

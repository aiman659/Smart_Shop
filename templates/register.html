{% extends "base.html" %}
{% block title %}Register | Smart Shop AI{% endblock %}
{% block content %}<section class="auth-section"><div class="auth-visual"><img src="{{ url_for('static', filename='images/hero.jpg') }}" alt="Fashion"></div><div class="auth-card"><span class="kicker">CREATE ACCOUNT</span><h1>Join Smart Shop AI</h1><p>Create a local demo account for the connected dashboard.</p><form method="POST"><label><span>Username</span><input name="username" required></label><label><span>Password</span><input type="password" name="password" required minlength="6"></label><label><span>Shopping interests</span><input name="interests" placeholder="Sneakers, jackets, dresses..."></label><button class="btn btn-primary btn-wide" type="submit">Create account</button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
